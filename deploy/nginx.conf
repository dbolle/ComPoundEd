# Compounded static PWA.
#
# Caching contract for a PWA (same as Brick Recall's):
#  - entry points (index.html, sw.js, registerSW.js, manifest) must always
#    revalidate, or browsers serve stale versions for hours and the service
#    worker itself never updates;
#  - hashed bundles under /assets/ are immutable forever;
#  - stable-URL icons get a short TTL (the service worker precache handles
#    their real versioning).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Family backup: LAN-only profile store (opt-in from the Grown-Ups area).
    # Same-origin, so it works from both the :8091 and compounded.lan fronts.
    # Family backup: proxied to the sync sidecar (deploy/sync-server.mjs)
    # which provides REAL conditional writes (ETag/If-Match CAS), lifecycle
    # envelopes, and family-key auth. Old direct-DAV serving is NOT a
    # rollback target — envelope files are not raw-client compatible; see
    # deploy/README.md for the tested rollback path.
    location /sync/profiles/ {
        proxy_pass http://sync:8092;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 5m;
        add_header Cache-Control "no-store";
    }

    # `/` is how everyone actually loads the app — without this, browsers
    # heuristic-cache the root HTML for DAYS and devices stick on old
    # versions (bit us: a Safari stuck on v1.12).
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
