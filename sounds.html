<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Compounded — animal voices</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #fdf8f0; color: #4b3b2a; margin: 0; padding: 20px; }
  h1 { font-size: 1.2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-width: 620px; }
  button { font: inherit; padding: 14px; border-radius: 14px; border: 0; background: #fff;
           box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  button:active { transform: scale(.97); }
  p.muted { color: #8a7863; font-size: .85rem; max-width: 620px; }
</style>
<h1>Animal voices — ear check 🎧</h1>
<p class="muted">Tap each one. These are the synthesized voices used when a pet says hi in the
Cozy Corner and when a buddy hosts a little-pup game. Nothing is recorded — all made in the
browser, so they work offline.</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { critterSound, soundWord, CRITTER_SPECIES } from './src/sound.js';
  const EMOJI = { dog: '🐶', cat: '🐱', rabbit: '🐰', guinea: '🐹', bird: '🐦', sloth: '🦥', hedgehog: '🦔', turtle: '🐢' };
  document.getElementById('grid').innerHTML = CRITTER_SPECIES.map(
    (s) => `<button data-s="${s}">${EMOJI[s] ?? '🐾'} ${s}<br><small>${soundWord(s)}</small></button>`
  ).join('');
  for (const b of document.querySelectorAll('[data-s]')) {
    b.addEventListener('click', () => critterSound(b.dataset.s));
  }
</script>
