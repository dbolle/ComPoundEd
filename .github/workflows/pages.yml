# Deploys the PWA to GitHub Pages on every push to main, so family outside
# the LAN can install it (https://dbolle.github.io/ComPoundEd/).
# One-time repo setting required: Settings → Pages → Source: GitHub Actions.
#
# Deployment is GATED on tests (never ship red — CLAUDE.md hard rule):
#  - test-insecure: the FULL suite on the runner's own LAN IP, an insecure
#    origin like the kids' http://<server>:8091 devices — this preserves
#    coverage of secure-context-only API regressions (crypto.randomUUID).
#  - test-secure: the @secure-tagged specs on 127.0.0.1, where a service
#    worker can actually register. Only the SW/offline spec needs that;
#    the privacy invariants deliberately run in the insecure lane, since
#    that is the origin the kids' devices actually use.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-insecure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  test-secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TEST_HOST: 127.0.0.1
          ONLY_SECURE: '1'

  build-and-deploy:
    needs: [test-insecure, test-secure]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /ComPoundEd/
          # Public host: a same-origin /sync/ home server cannot exist here,
          # so the backup controls are hidden and never probed for.
          VITE_PUBLIC_DEMO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
